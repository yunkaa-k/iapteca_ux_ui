services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?Run scripts/setup-local.ps1 first}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?Run scripts/setup-local.ps1 first}
      MONGO_INITDB_DATABASE: admin
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:?Run scripts/setup-local.ps1 first}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Run scripts/setup-local.ps1 first}
    volumes:
      - iapteca_ux_ui_mongo_data:/data/db
      - ./.local/mongo-keyfile:/run/secrets/mongo-keyfile:ro
      - ./scripts/mongo-entrypoint.sh:/usr/local/bin/local-mongo-entrypoint.sh:ro
      - ./scripts/mongo-init-user.sh:/docker-entrypoint-initdb.d/02-create-app-user.sh:ro
      - ./scripts/mongo-healthcheck.sh:/usr/local/bin/local-mongo-healthcheck.sh:ro
    entrypoint: ["/bin/bash", "/usr/local/bin/local-mongo-entrypoint.sh"]
    healthcheck:
      test: ["CMD", "/bin/bash", "/usr/local/bin/local-mongo-healthcheck.sh"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 30s

volumes:
  iapteca_ux_ui_mongo_data:
    name: iapteca_ux_ui_mongo_data
